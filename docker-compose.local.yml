name: juntia-local
services:
  api:
    build:
      context: .
    image: juntia:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-7778}:7778"
    environment:
      DATABASE_URL: "postgresql+asyncpg://juntia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/juntia"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      ALLOW_INSECURE_LOCAL_ADMIN: "true"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET}"
      PUBLIC_ORIGIN: "${LOCAL_PUBLIC_ORIGIN:-http://localhost:7778}"
      AUTH_COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/data/uploads
      # Action PDF budgets in MiB; withdrawn PDFs count until the administrator purges them.
      ACTION_STORAGE_USER_QUOTA_MB: "${ACTION_STORAGE_USER_QUOTA_MB:-250}"
      ACTION_STORAGE_COMMUNITY_QUOTA_MB: "${ACTION_STORAGE_COMMUNITY_QUOTA_MB:-2048}"
      # Free space (MiB) that PDF uploads and statement imports leave on the uploads volume.
      MIN_FREE_DISK_MB: "${MIN_FREE_DISK_MB:-1024}"
      TZ: "${TZ:-Europe/Madrid}"
      APP_LANGUAGE: "${APP_LANGUAGE:-en}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-10}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juntia
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: juntia
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juntia -d juntia"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  uploads:
