[project]
name = "juntia"
version = "0.1.0"
description = "Self-hosted portal for a residential community: transparent shared finances from bank statements, community actions, events and contacts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "DrDonoso" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pdfplumber>=0.11",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "openai>=1.40",
    "regex>=2024.5.15",
    "email-validator>=2.2",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
    "icalendar>=6.1",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/DrDonoso/juntia"
Repository = "https://github.com/DrDonoso/juntia"
Issues = "https://github.com/DrDonoso/juntia/issues"
Demo = "https://demo.juntia.drdonoso.com"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "reportlab>=4",
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "ruff>=0.16",
    "pytest-split>=0.11,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src/juntia"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
