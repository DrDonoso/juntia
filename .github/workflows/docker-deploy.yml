name: Build and publish Docker image
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: juntia-release
  cancel-in-progress: false
jobs:
  validate:
    # Not GitHub's newer `$/` self-repository syntax yet: actionlint 1.7.12 rejects it
    # (rhysd/actionlint#711). A reusable workflow call with `./` is resolved from the running commit
    # when the run starts, with no checkout involved.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the Docker Hub secrets; its deployment branch rule admits only main.
    environment: release
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, for the CalVer sequence
          persist-credentials: false
      - name: Compute serialized CalVer
        id: version
        shell: bash
        run: |
          set -euo pipefail
          day=$(date -u +%Y%m%d)
          version="$day"
          number=2
          while git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; do
            version=$(printf '%s.%02d' "$day" "$number")
            number=$((number + 1))
          done
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # No layer cache: the image is built from scratch, so nothing that another job on main could
      # write to the shared Actions cache (a compromised test-only dependency, for example) can end
      # up in the published image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            drdonoso/juntia:latest
            drdonoso/juntia:${{ steps.version.outputs.value }}
          build-args: |
            IMAGE_TAG=${{ steps.version.outputs.value }}
            BUILD_DATE=${{ steps.version.outputs.date }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
